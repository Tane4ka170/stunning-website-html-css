<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>DERMEXCEL</title>
  </head>
  <body>
    <div class="ambient-1"></div>
    <div class="ambient-2"></div>
    <div class="cursor"></div>

    <header class="site-header">
      <div class="logo">
        <span class="logo-cube"
          ><svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <defs>
              <linearGradient id="cubeGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#3a3a3a" />
                <stop offset="100%" stop-color="#0a0a0a" />
              </linearGradient>
            </defs>
            <path
              d="M17 3 L29 9 L29 21 L17 27 L17 15 L5 9 Z"
              fill="url(#cubeGrad)"
              stroke="currentColor"
              stroke-width="0.5"
            />
            <path
              d="M5 9 L17 15 L17 27 L5 21 Z"
              fill="#2a2a2a"
              stroke="currentColor"
              stroke-width="0.5"
            />
            <path
              d="M17 3 L29 9 L17 15 L5 9 Z"
              fill="#444"
              stroke="currentColor"
              stroke-width="0.5"
            /></svg
        ></span>
        <span>DERMEXCEL</span>
      </div>
      <nav class="header-nav">
        <a href="#features">Features </a>
        <a href="#analytics">Analytics</a>
        <a href="#integrations">Integrations</a>
        <a href="#pricing">Pricing</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Get in touch</a>
      </nav>

      <!-- Mobile hamburger -->
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="header-actions">
        <button
          id="themeToggle"
          class="theme-toggle-btn"
          aria-label="Toggletheme"
        >
          <svg
            class="sun-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg
            class="moon-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <a href="#" class="header-btn"
          >Start for free
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </header>

    <!-- Mobile nav overlay -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay">
      <button
        class="mobile-nav-close"
        id="mobileNavClose"
        aria-label="Close menu"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <nav class="header-nav">
        <a href="#features">Features </a>
        <a href="#analytics">Analytics</a>
        <a href="#integrations">Integrations</a>
        <a href="#pricing">Pricing</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Get in touch</a>
      </nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
